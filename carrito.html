<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrito — Hermanos Jota</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/carrito.css" />
</head>
<body>
  <header class="site-header">
    <div class="contenedor">
      <a href="index.html">
        <img class="logo" src="assets/img/brand/logo.svg" alt="Hermanos Jota" />
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="menu-principal" aria-label="Abrir menú">☰</button>
      <nav>
        <ul class="site-nav" id="menu-principal">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="productos.html">Catálogo</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li>
            <a href="carrito.html" aria-label="Carrito">
              Carrito<span class="carrito-contador" data-carrito-contador>0</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <h1>Tu carrito</h1>
    <div data-carrito-lista>
      <p class="estado-carga">Cargando carrito…</p>
    </div>

    <div class="resumen-carrito">
      <span>Total</span>
      <span data-carrito-total>$ 0</span>
    </div>

    <div class="acciones-carrito">
      <button type="button" class="boton-carrito" data-vaciar-carrito hidden>Vaciar carrito</button>
      <a href="productos.html" class="boton-carrito">Seguir comprando</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="contenedor">
      <p>&copy; 2026 Hermanos Jota. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/data/products-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
